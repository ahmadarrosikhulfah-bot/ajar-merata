<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajar Merata · Perangkat Ajar Gratis untuk Guru 3T</title>
<style>body{margin:0;background:#f7f3ea;color:#1f2a28;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style>
</head>
<body>
<p id="am-loading" style="padding:24px">Memuat Ajar Merata...</p>
<script>
(function () {
  var sumber = ["https://ahmadarrosikhulfah-bot.github.io/ajar-merata/app.js?j=" + Math.floor(Date.now() / 36e5), "https://cdn.jsdelivr.net/gh/ahmadarrosikhulfah-bot/ajar-merata@main/app.js"];
  function muat(i) {
    if (i >= sumber.length) { document.getElementById("am-loading").textContent = "Aplikasi belum termuat. Periksa koneksi internet lalu muat ulang halaman ini."; return; }
    var s = document.createElement("script");
    s.src = sumber[i];
    s.onerror = function () { muat(i + 1); };
    document.body.appendChild(s);
  }
  muat(0);
})();
</script>
</body>
</html>

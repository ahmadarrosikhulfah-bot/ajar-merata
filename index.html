<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajar Merata · Perangkat Ajar Gratis untuk Guru 3T</title>
<style>
:root{
  --ink:#1f2a28; --muted:#646b63; --paper:#f7f3ea; --card:#ffffff; --line:#e3dccb; --line2:#cfc6b1;
  --teal:#0f6f66; --teal2:#0b5a53; --teal-soft:#e3f1ee; --clay:#b8522a; --clay-soft:#fbe9e0;
  --sun:#e4ac2f; --sun-soft:#fdf3d8; --ok:#2f7d3b; --ok-soft:#e5f3e6; --bad:#b3261e; --bad-soft:#fdeceb;
  --r:12px; --sh:0 1px 2px rgba(31,42,40,.06),0 4px 14px rgba(31,42,40,.05);
}
*{box-sizing:border-box}
html{font-size:100%}
html.fs1{font-size:112.5%}
html.fs2{font-size:125%}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:0.9375rem;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:40;background:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.top-in{max-width:1200px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--teal);display:grid;place-items:center;font-weight:800;font-size:0.9375rem;flex:none}
.brand{min-width:0;flex:1}
.brand b{display:block;font-size:0.9375rem;line-height:1.2}
.brand small{display:block;opacity:.85;font-size:0.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkgsel{max-width:46vw;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;padding:6px 8px;font-size:0.8125rem}
.pkgsel option{color:var(--ink)}
.iconbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;min-width:40px;height:36px;padding:0 10px;cursor:pointer;font-weight:600}
.savebar{background:var(--teal2);font-size:0.75rem}
.savebar .top-in{padding:4px 14px;gap:8px;flex-wrap:wrap}
.savebar .btn{color:var(--ink)}
@media(max-width:640px){.savebar .hint{display:none}}
main{min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:#7ee0a8;display:inline-block}
.dot.warn{background:var(--sun)}

/* layout */
.wrap{max-width:1200px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:960px){.wrap{grid-template-columns:260px 1fr}}
.steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
@media(min-width:960px){.steps{flex-direction:column;overflow:visible;position:sticky;top:96px;align-self:start}}
.step{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;min-height:44px}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:0.75rem;font-weight:700;background:var(--paper);border:1px solid var(--line2);flex:none}
.step .t{font-size:0.8125rem;font-weight:600;white-space:nowrap}
.step .s{font-size:0.6875rem;color:var(--muted);display:block}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step.active{border-color:var(--teal);background:var(--teal-soft)}
.step.active .n{background:var(--teal);border-color:var(--teal);color:#fff}
.ai-tag{font-size:0.625rem;font-weight:700;color:var(--clay);background:var(--clay-soft);border-radius:6px;padding:0 5px;margin-left:4px}

/* cards & forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:1.25rem;line-height:1.25}
.card h3{margin:0 0 8px;font-size:1rem}
.lead{color:var(--muted);margin:0 0 12px;font-size:0.875rem}
.grid2{display:grid;grid-template-columns:1fr;gap:10px 14px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:1fr;gap:10px 14px}
@media(min-width:640px){.grid3{grid-template-columns:1fr 1fr 1fr}}
label.f{display:block;font-size:0.8125rem;font-weight:600;margin-bottom:3px}
label.f small{font-weight:400;color:var(--muted)}
.in{width:100%;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;background:#fff;min-height:42px}
textarea.in{min-height:90px;resize:vertical}
.in:focus{outline:2px solid var(--sun);outline-offset:1px;border-color:var(--teal)}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:0.875rem;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--teal)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 14px;min-height:42px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--teal)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal2)}
.btn.ai{background:var(--clay);border-color:var(--clay);color:#fff}
.btn.ai.done{background:#fff;color:var(--clay)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:0.8125rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#e8c2bf}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{border-radius:10px;padding:10px 12px;font-size:0.875rem;margin:10px 0}
.note.info{background:var(--teal-soft);border:1px solid #bfdcd6}
.note.warn{background:var(--sun-soft);border:1px solid #f0d58f}
.note.bad{background:var(--bad-soft);border:1px solid #f0c2bf}
.note.ok{background:var(--ok-soft);border:1px solid #bfdcc2}
.pill{display:inline-block;font-size:0.75rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line2)}
.pill.ok{background:var(--ok-soft);border-color:#bfdcc2;color:var(--ok)}
.pill.bad{background:var(--bad-soft);border-color:#f0c2bf;color:var(--bad)}
details.help{border:1px dashed var(--line2);border-radius:10px;padding:8px 12px;margin:8px 0 12px;background:#fffdf8}
details.help summary{cursor:pointer;font-weight:600;font-size:0.875rem}
details.help ol,details.help ul{margin:8px 0 4px;padding-left:20px;font-size:0.875rem}
.navbtm{display:flex;justify-content:space-between;gap:10px;margin-top:6px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:0.8438rem}
table.t th,table.t td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
table.t th{background:#f3efe4;font-weight:700;position:sticky;top:0}
table.t td:last-child,table.t th:last-child{border-right:none}
table.t td.num,table.t th.num{text-align:center;white-space:nowrap}
table.t .cell-in{width:100%;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent;min-height:34px;resize:vertical}
table.t .cell-in:focus{border-color:var(--teal);background:#fff;outline:none}
table.t td.hl{background:var(--teal-soft);font-weight:700;text-align:center}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fffefb}
.sec h4{margin:0 0 6px;font-size:0.9375rem;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pre{white-space:pre-wrap;word-break:break-word}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:0.875rem}
.kv div:nth-child(odd){color:var(--muted)}

/* modal, drawer, overlay */
.ovl{position:fixed;inset:0;background:rgba(20,28,26,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.ovl{align-items:center}}
.modal{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:720px){.modal{border-radius:16px}}
.modal h2{margin:0 0 6px;font-size:1.1875rem}
.mhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.menu-list{display:grid;gap:8px}
.menu-list .btn{justify-content:flex-start;width:100%}
.busy{position:fixed;inset:0;z-index:90;background:rgba(247,243,234,.85);display:grid;place-items:center}
.busy-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px;text-align:center;box-shadow:var(--sh);max-width:340px}
.spin{width:34px;height:34px;border:4px solid var(--teal-soft);border-top-color:var(--teal);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:95;font-size:0.875rem;max-width:90vw}
.muted{color:var(--muted)}
.small{font-size:0.8125rem}
.mt0{margin-top:0}.mb0{margin-bottom:0}
.elem{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fffefb}
.budget{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:0.875rem;font-weight:600}
.budget .over{color:var(--bad)}
.welcome .big{width:100%;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:58px;font-size:1.05rem;text-align:left}
.welcome .big small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.welcome .big.pri small{color:#d9efe9}
.fsrow .btn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
footer.foot{max-width:1200px;margin:0 auto;padding:10px 14px 30px;color:var(--muted);font-size:0.75rem}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo" aria-hidden="true">AM</div>
    <div class="brand"><b>Ajar Merata</b><small>Perangkat ajar gratis untuk guru 3T · Pembelajaran Mendalam &amp; KBC</small></div>
    <select id="pkgSel" class="pkgsel" aria-label="Paket aktif"></select>
    <button class="iconbtn" data-act="cycleFont" aria-label="Ukuran tulisan" title="Ukuran tulisan">Aa</button>
    <button class="iconbtn" data-act="openMenu" aria-label="Menu">☰ Menu</button>
  </div>
  <div class="savebar"><div class="top-in" id="saveBar"></div></div>
</header>
<div class="wrap">
  <nav class="steps" id="steps" aria-label="Langkah"></nav>
  <main id="main"></main>
</div>
<footer class="foot">Ajar Merata v1.0 · Dibuat untuk dibagikan gratis kepada guru. Hasil AI adalah draf: periksa, sesuaikan dengan kelas Anda, dan cek setiap acuan pada kanal resmi Kemendikdasmen/Kemenag.</footer>
<div id="layer"></div>
<script>
"use strict";
/* ============ KONFIGURASI AI (Gemini Canvas) ============
   Gemini Canvas mengisi kunci API secara otomatis bila apiKey dibiarkan kosong.
   Kunci bawaan Canvas hanya berlaku untuk model tertentu yang berganti dari waktu ke waktu.
   Aplikasi mencoba model di bawah satu per satu dan mengingat yang berhasil.

   "perbarui nama model di AI_MODELS ke model yang didukung Canvas saat ini". */
const apiKey = "";
/* Deteksi: berjalan di dalam Gemini Canvas atau tidak */
const IN_CANVAS = (function(){
  let src = location.href + " " + location.origin + " " + document.referrer;
  try { if (location.ancestorOrigins) for (let i = 0; i < location.ancestorOrigins.length; i++) src += " " + location.ancestorOrigins[i]; } catch (e) {}
  return /usercontent\.goog|googleusercontent\.com|gemini\.google\.com/.test(src);
})();
const USERKEY_STORE = "ajarMerata.userKey";
function userKey(){ try { return localStorage.getItem(USERKEY_STORE) || ""; } catch (e) { return ""; } }
function setUserKey(v){ try { if (v) localStorage.setItem(USERKEY_STORE, v); else localStorage.removeItem(USERKEY_STORE); } catch (e) {} }
function aiLangsung(){ return IN_CANVAS || !!userKey(); }
const AI_MODELS = ["gemini-3-flash-preview", "gemini-2.5-flash-preview-09-2025", "gemini-2.5-flash", "gemini-flash-latest"];

const APP_VER = "1.1";

/* ============ DATA ACUAN ============ */
const DPL = ["Keimanan dan Ketakwaan terhadap Tuhan Yang Maha Esa", "Kewargaan", "Penalaran Kritis", "Kreativitas", "Kolaborasi", "Kemandirian", "Kesehatan", "Komunikasi"];
const DPL_SHORT = ["Keimanan & Ketakwaan", "Kewargaan", "Penalaran Kritis", "Kreativitas", "Kolaborasi", "Kemandirian", "Kesehatan", "Komunikasi"];
const PANCA_CINTA = ["Cinta Allah dan Rasul-Nya", "Cinta Ilmu", "Cinta Lingkungan", "Cinta Diri dan Sesama", "Cinta Tanah Air"];

/* scope: all | agama (mapel Agama & BP di sekolah) | madrasah | kbc | cpmadrasah */
const REGS_DEFAULT = [
  {id:"r1", scope:"all", text:"Peraturan Menteri Pendidikan, Kebudayaan, Riset, dan Teknologi Nomor 12 Tahun 2024 tentang Kurikulum pada Pendidikan Anak Usia Dini, Jenjang Pendidikan Dasar, dan Jenjang Pendidikan Menengah, sebagaimana diubah dengan Peraturan Menteri Pendidikan Dasar dan Menengah Nomor 13 Tahun 2025."},

  {id:"r6", scope:"all", text:"Peraturan Menteri Pendidikan Dasar dan Menengah Nomor 10 Tahun 2025 tentang Standar Kompetensi Lulusan pada Pendidikan Anak Usia Dini, Jenjang Pendidikan Dasar, dan Jenjang Pendidikan Menengah."},
  {id:"r7", scope:"all", text:"Peraturan Menteri Pendidikan Dasar dan Menengah Nomor 12 Tahun 2025 tentang Standar Isi pada Pendidikan Anak Usia Dini, Jenjang Pendidikan Dasar, dan Jenjang Pendidikan Menengah."},
  {id:"m1", scope:"madrasah", text:"Keputusan Menteri Agama Nomor 1503 Tahun 2025 tentang Perubahan atas Keputusan Menteri Agama Nomor 450 Tahun 2024 tentang Pedoman Implementasi Kurikulum pada Raudhatul Athfal, Madrasah Ibtidaiyah, Madrasah Tsanawiyah, Madrasah Aliyah, dan Madrasah Aliyah Kejuruan."},

  {id:"m4", scope:"cpmadrasah", text:"Keputusan Direktur Jenderal Pendidikan Islam Nomor 9941 Tahun 2025 tentang Capaian Pembelajaran Mata Pelajaran Pendidikan Agama Islam dan Bahasa Arab pada Madrasah."}
];
const SCOPE_LABEL = {all:"Semua sekolah & madrasah", agama:"Khusus mapel Agama dan Budi Pekerti (sekolah)", madrasah:"Khusus madrasah (Kemenag)", kbc:"Kurikulum Berbasis Cinta", kbcm:"Kurikulum Berbasis Cinta di madrasah", cpmadrasah:"Khusus PAI & Bahasa Arab di madrasah"};

const JENJANG = {
  kemendikdasmen: ["PAUD/TK", "SD", "SMP", "SMA", "SMK"],
  kemenag: ["RA", "MI", "MTs", "MA", "MAK"]
};
const KELAS = {"PAUD/TK":["Kelompok A","Kelompok B"], RA:["Kelompok A","Kelompok B"], SD:["1","2","3","4","5","6"], MI:["1","2","3","4","5","6"], SMP:["7","8","9"], MTs:["7","8","9"], SMA:["10","11","12"], MA:["10","11","12"], SMK:["10","11","12"], MAK:["10","11","12"]};
const MENIT = {"PAUD/TK":30, RA:30, SD:35, MI:35, SMP:40, MTs:40, SMA:45, MA:45, SMK:45, MAK:45};
const AGAMA_LIST = ["Islam","Kristen","Katolik","Hindu","Buddha","Khonghucu"];
const PAI_MADRASAH = ["Al-Qur'an Hadis","Akidah Akhlak","Fikih","Sejarah Kebudayaan Islam","Bahasa Arab"];
const PAI_MA_KEAGAMAAN = ["Tafsir","Ilmu Tafsir","Hadis","Ilmu Hadis","Ushul Fikih"];

function mapelOptions(p){
  const j = p.jenjang, k = +p.kelas || 0, kemenag = p.kementerian === "kemenag";
  if (j === "PAUD/TK") return ["Fase Fondasi (terpadu): Nilai Agama dan Budi Pekerti, Jati Diri, Dasar-dasar Literasi, Matematika, Sains, Teknologi, Rekayasa, dan Seni"];
  if (j === "RA") return ["Fase Fondasi (terpadu): Nilai Agama dan Budi Pekerti, Jati Diri, Dasar-dasar Literasi, Matematika, Sains, Teknologi, Rekayasa, dan Seni", "PAI dan Bahasa Arab (RA)"];
  let L = [];
  if (kemenag) L = L.concat(PAI_MADRASAH);
  else L.push("Pendidikan Agama dan Budi Pekerti", "Pendidikan Kepercayaan terhadap Tuhan Yang Maha Esa dan Budi Pekerti");
  L.push("Pendidikan Pancasila", "Bahasa Indonesia", "Matematika");
  if (["SD","MI"].includes(j)) { L.push("Ilmu Pengetahuan Alam dan Sosial (IPAS)", "Pendidikan Jasmani, Olahraga, dan Kesehatan (PJOK)", "Seni Musik", "Seni Rupa", "Seni Tari", "Seni Teater", "Bahasa Inggris"); if (k >= 5) L.push("Koding dan Kecerdasan Artifisial"); }
  if (["SMP","MTs"].includes(j)) L.push("Ilmu Pengetahuan Alam (IPA)", "Ilmu Pengetahuan Sosial (IPS)", "Bahasa Inggris", "PJOK", "Informatika", "Seni Musik", "Seni Rupa", "Seni Tari", "Seni Teater", "Prakarya", "Koding dan Kecerdasan Artifisial");
  if (["SMA","MA","SMK","MAK"].includes(j)) {
    L.push("Bahasa Inggris", "PJOK", "Sejarah", "Seni dan Budaya");
    if (["SMA","MA"].includes(j)) {
      if (k === 10) L.push("Ilmu Pengetahuan Alam (IPA)", "Ilmu Pengetahuan Sosial (IPS)", "Informatika");
      else L.push("Fisika","Kimia","Biologi","Ekonomi","Geografi","Sosiologi","Antropologi","Informatika","Matematika Tingkat Lanjut","Bahasa Indonesia Tingkat Lanjut","Bahasa Inggris Tingkat Lanjut");
      L.push("Koding dan Kecerdasan Artifisial");
      if (kemenag && k >= 11) L = L.concat(PAI_MA_KEAGAMAAN);
    } else {
      L.push("Informatika", "Projek Ilmu Pengetahuan Alam dan Sosial", "Dasar-dasar Program Keahlian", "Konsentrasi Keahlian", "Projek Kreatif dan Kewirausahaan", "Mata Pelajaran Pilihan");
    }
  }
  L.push("Muatan Lokal");
  return [...new Set(L)];
}
function faseOf(p){
  if (["PAUD/TK","RA"].includes(p.jenjang)) return "Fondasi";
  const k = +p.kelas;
  if (k <= 2) return "A"; if (k <= 4) return "B"; if (k <= 6) return "C"; if (k <= 9) return "D"; if (k === 10) return "E"; return "F";
}
function isAgamaSekolah(p){ return p.kementerian !== "kemenag" && /Agama dan Budi Pekerti|Kepercayaan/.test(p.mapel); }
function isPAIMadrasah(p){ return p.kementerian === "kemenag" && (PAI_MADRASAH.concat(PAI_MA_KEAGAMAAN).includes(p.mapel) || /PAI dan Bahasa Arab/.test(p.mapel)); }
function isAgama(p){ return isAgamaSekolah(p) || isPAIMadrasah(p); }
function mapelName(p){
  if (!p) return "";
  if (p.mapel === "__lain") return p.mapelLain || "Mapel lainnya";
  if (p.mapel === "Pendidikan Agama dan Budi Pekerti") return "Pendidikan Agama " + (p.agama || "Islam") + " dan Budi Pekerti";
  return p.mapel || "";
}
function cpSumberSaran(p){
  if (isPAIMadrasah(p)) return "Keputusan Dirjen Pendis No. 9941 Tahun 2025 (CP PAI & Bahasa Arab Madrasah)";
  if (isAgamaSekolah(p)) return "Keputusan Kepala BKPDM No. 020 Tahun 2026 (perubahan CP Agama & BP)";

function cleanJSON(txt){
  let t = String(txt || "").trim();
  t = t.replace(/^```(?:json)?/i, "").replace(/```\s*$/i, "").trim();
  const i1 = t.search(/[\[{]/); if (i1 > 0) t = t.slice(i1);
  const lastObj = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]")); if (lastObj > -1) t = t.slice(0, lastObj + 1);
  try { return JSON.parse(t); } catch (e) {}
  const t2 = t.replace(/,\s*([}\]])/g, "$1").replace(/[“”]/g, '"');
  return JSON.parse(t2);
}

async function callGemini(sys, prompt){
  const order = state.ai.lastOk ? [state.ai.lastOk].concat(state.ai.models.filter(m => m !== state.ai.lastOk)) : state.ai.models.slice();
  let lastErr = null;
  for (const model of order) {
    for (let attempt = 0; attempt < 3; attempt++) {
      let res;
      try {
        res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent?key=" + encodeURIComponent(userKey() || apiKey), {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({
            contents:[{role:"user", parts:[{text: prompt}]}],
            systemInstruction:{parts:[{text: sys}]},
            generationConfig:{responseMimeType:"application/json", temperature:0.6}
          })
        });
      } catch (e) { lastErr = {kind:"jaringan", msg:"Tidak bisa terhubung ke server AI (" + e.message + ")."}; await sleep(1500 * (attempt + 1)); continue; }
      if (res.ok) {
        const data = await res.json();
        const cand = data.candidates && data.candidates[0];
        const text = cand && cand.content && cand.content.parts ? cand.content.parts.map(x => x.text || "").join("") : "";
        if (!text) { lastErr = {kind:"kosong", msg:"AI tidak memberi jawaban" + (cand && cand.finishReason ? " (" + cand.finishReason + ")" : "") + "."}; break; }
        try { const obj = cleanJSON(text); state.ai.lastOk = model; save(); return obj; }
        catch (e) { lastErr = {kind:"format", msg:"Jawaban AI terpotong atau tidak berformat JSON. Coba lagi, atau kurangi jumlah TP per klik.", raw:text}; if (cand && cand.finishReason === "MAX_TOKENS") break; continue; }
      }
      let detail = ""; try { const j = await res.json(); detail = j.error && j.error.message ? j.error.message : ""; } catch (e) {}
      if (res.status === 403 || res.status === 404 || res.status === 400) { lastErr = {kind:"model", msg:"Model " + model + " tidak bisa dipakai (HTTP " + res.status + "). " + detail}; break; }
      if (res.status === 429) { lastErr = {kind:"kuota", msg:"Kuota AI akun Gemini sedang habis (HTTP 429). Tunggu beberapa menit atau coba besok."}; await sleep(2500 * (attempt + 1)); continue; }
      lastErr = {kind:"server", msg:"Server AI sibuk (HTTP " + res.status + "). " + detail}; await sleep(2000 * (attempt + 1));
    }
  }
  throw lastErr || {kind:"lain", msg:"AI gagal tanpa keterangan."};
}

  String(state.kalender.libur || "").split(/\n/).forEach(line => {
    const l = line.trim(); if (!l) return;
    let m = /^(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{4})\s*(?:sampai|s\.?d\.?|-|–)\s*(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{4})\s*(.*)$/i.exec(l);
    if (m) { const a = parseDMY(m[1]), b = parseDMY(m[2]); if (!a || !b || b < a) { bad.push(l); return; } for (let d = a; d <= b; d = addDays(d, 1)) set[key(d)] = m[3] || "Libur"; return; }
    m = /^(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{4})\s*(.*)$/.exec(l);
    if (m) { const a = parseDMY(m[1]); if (!a) { bad.push(l); return; } set[key(a)] = m[2] || "Libur"; return; }
    bad.push(l);
  });
  return {set, bad};
}
/* hasil: {s1:{weeks:[{start, jp, meet, label, month}], total}, s2:..., bad} */
function hitungKalender(p){
  p = p || P();
  const {set, bad} = liburSet();
  const out = {bad};
  [["s1", state.kalender.s1Mulai, state.kalender.s1Akhir], ["s2", state.kalender.s2Mulai, state.kalender.s2Akhir]].forEach(([s, a, b]) => {
    const A = parseISO(a), B = parseISO(b), weeks = [];
    if (A && B && B >= A) {
      let wk = addDays(A, -((A.getDay() + 6) % 7)); // Senin minggu pertama
      while (wk <= B) {
        let jp = 0, meet = 0, libur = 0;
        for (let i = 0; i < 6; i++) {
          const d = addDays(wk, i); if (d < A || d > B) continue;
          const dow = d.getDay(); const j = +(p.jadwal[dow] || 0);
          if (!j) continue;
          if (set[key(d)]) { libur++; continue; }
          jp += j; meet++;
        }
        weeks.push({start:key(wk), month:wk.getMonth() < 0 ? 0 : (addDays(wk, 3)).getMonth(), year:addDays(wk,3).getFullYear(), jp, meet, libur});
        wk = addDays(wk, 7);
      }
    }
    // nomor minggu per bulan
    const cnt = {};
    weeks.forEach(w => { const k2 = w.year + "-" + w.month; cnt[k2] = (cnt[k2] || 0) + 1; w.mInMonth = cnt[k2]; w.label = BULAN_SINGKAT[w.month] + "-" + w.mInMonth; });
    out[s] = {weeks, total: weeks.reduce((x, w) => x + w.jp, 0), efektif: weeks.filter(w => w.jp > 0).length};
  });
  return out;
}
function jpPerMinggu(p){ return Object.values(p.jadwal || {}).reduce((a, b) => a + (+b || 0), 0); }
function atpJP(p, sem){ return (p.atp || []).filter(t => !sem || +t.semester === sem).reduce((a, t) => a + (+t.jp || 0), 0); }

/* ============ PROMES ============ */
function sebarPromes(p){
  const kal = hitungKalender(p); const res = {};
  [1, 2].forEach(sem => {
    const weeks = kal["s" + sem].weeks.map(w => Object.assign({}, w, {sisa: w.jp}));
    const rows = []; let wi = 0;
    p.atp.filter(t => +t.semester === sem).forEach(t => {
      let need = +t.jp || 0; const cells = {};
      while (need > 0 && wi < weeks.length) {
        const w = weeks[wi];
        if (w.sisa <= 0) { wi++; continue; }
        const take = Math.min(need, w.sisa); cells[w.start] = (cells[w.start] || 0) + take; w.sisa -= take; need -= take;
        if (w.sisa <= 0) wi++;
      }
      rows.push({tp:t, cells, kurang:need});
    });
    res[sem] = {weeks, rows};
  });
  return res;
}

function stepDone(n){
  const p = P(), pr = state.profil;
  switch (n) {
    case 1: return !!(pr.namaGuru && pr.sekolah);
    case 2: return !!(p.mapel && p.kelas && (p.mapel !== "__lain" || p.mapelLain));
    case 3: return jpPerMinggu(p) > 0 && hitungKalender(p).s1.total > 0;
    case 4: return !!p.cpTeks.trim();
    case 5: return p.atp.length > 0;
    case 6: case 7: return p.atp.length > 0 && jpPerMinggu(p) > 0;
    case 8: return p.atp.length > 0 && p.atp.every(t => p.kktp[t.id]);
    case 9: return Object.values(p.modul).some(m => m && m.parts && ["identifikasi","desain","pengalaman","asesmen","lampiran"].every(k => m.parts[k]));
    case 10: return Object.keys(p.lkpd).length > 0;
    case 11: return p.asesmen.rows.length > 0;
    case 12: return p.kisi.butir.length > 0;
    case 13: return !!p.analisis.hasil;
  }
  return false;
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== "ovlClick") ev.preventDefault();
  fn(el.dataset.arg, el, ev);
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.bind) {
    let v = el.type === "checkbox" ? el.checked : el.value;
    if (el.dataset.num !== undefined) v = v === "" ? 0 : +v;
    setPath(el.dataset.bind, v);
    if (el.dataset.after && AFTER[el.dataset.after]) AFTER[el.dataset.after]();
    save();
    if (el.dataset.rerender !== undefined) { const y = window.scrollY; render(); window.scrollTo(0, y); }
    else if (el.dataset.live) { const fn = LIVE[el.dataset.live]; if (fn) fn(); }
  }
  if (el.dataset.regi !== undefined) { state.regs[+el.dataset.regi].checked = el.checked; save(); }
  if (el.dataset.regc !== undefined) { state.regsCustom[+el.dataset.regc].checked = el.checked; save(); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.id === "pkgSel") { state.active = +el.value; save(); renderAll(); return; }
});

function inp(bind, label, opt){
  opt = opt || {}; const v = getPath(bind);
  return `<div><label class="f">${label}${opt.hint ? ` <small>${opt.hint}</small>` : ""}</label><input class="in" ${opt.type ? `type="${opt.type}"` : ""} data-bind="${bind}" ${opt.num ? "data-num" : ""} ${opt.live ? `data-live="${opt.live}"` : ""} value="${esc(v)}" placeholder="${esc(opt.ph || "")}" ${opt.min != null ? `min="${opt.min}"` : ""}></div>`;
}
function sel(bind, label, options, opt){
  opt = opt || {}; const v = getPath(bind);
  const o = options.map(x => { const val = Array.isArray(x) ? x[0] : x, lab = Array.isArray(x) ? x[1] : x; return `<option value="${esc(val)}" ${String(v) === String(val) ? "selected" : ""}>${esc(lab)}</option>`; }).join("");
  return `<div><label class="f">${label}${opt.hint ? ` <small>${opt.hint}</small>` : ""}</label><select class="in" data-bind="${bind}" ${opt.rerender ? "data-rerender" : ""} ${opt.after ? `data-after="${opt.after}"` : ""}>${opt.empty ? `<option value="">${esc(opt.empty)}</option>` : ""}${o}</select></div>`;
}
function ta(bind, label, opt){
  opt = opt || {};
  return `<div><label class="f">${label}${opt.hint ? ` <small>${opt.hint}</small>` : ""}</label><textarea class="in" data-bind="${bind}" ${opt.live ? `data-live="${opt.live}"` : ""} style="${opt.h ? "min-height:" + opt.h + "px" : ""}" placeholder="${esc(opt.ph || "")}">${esc(getPath(bind))}</textarea></div>`;
}
function cb(bind, label){ return `<label class="chk"><input type="checkbox" data-bind="${bind}" ${getPath(bind) ? "checked" : ""}><span>${label}</span></label>`; }

function kalSummary(p){
  const k = hitungKalender(p);
  const bad = k.bad.length ? `<div class="note bad">Baris berikut tidak terbaca dan diabaikan:<br>${k.bad.map(esc).join("<br>")}</div>` : "";
  const tbl = (s, title) => {
    const byM = {}; k[s].weeks.forEach(w => { const kk = w.year + "-" + String(w.month).padStart(2, "0"); (byM[kk] = byM[kk] || {m:w.month, y:w.year, n:0, ef:0, jp:0}); byM[kk].n++; if (w.jp > 0) byM[kk].ef++; byM[kk].jp += w.jp; });
    const rows = Object.keys(byM).sort().map(kk => { const b = byM[kk]; return `<tr><td>${BULAN_SINGKAT[b.m]} ${b.y}</td><td class="num">${b.n}</td><td class="num">${b.n - b.ef}</td><td class="num">${b.ef}</td><td class="num">${b.jp}</td></tr>`; }).join("");
    return `<h3 style="margin-top:14px">${title}</h3><div class="tbl-wrap"><table class="t"><tr><th>Bulan</th><th class="num">Minggu</th><th class="num">Tidak efektif</th><th class="num">Efektif</th><th class="num">JP</th></tr>${rows || '<tr><td colspan="5" class="muted">Tanggal belum lengkap.</td></tr>'}<tr><th>Jumlah</th><th class="num">${k[s].weeks.length}</th><th class="num">${k[s].weeks.length - k[s].efektif}</th><th class="num">${k[s].efektif}</th><th class="num">${k[s].total}</th></tr></table></div>`;
  };
  return bad + tbl("s1", "Semester 1 (ganjil)") + tbl("s2", "Semester 2 (genap)") +
    `<div class="note info"><b>JP tersedia setahun: ${k.s1.total + k.s2.total} JP</b> (Semester 1: ${k.s1.total} JP · Semester 2: ${k.s2.total} JP). Minggu dihitung efektif bila ada minimal satu pertemuan mapel ini.</div>`;
}
LIVE.kal = () => { const el = document.getElementById("kalOut"); if (el) el.innerHTML = kalSummary(P()); renderNav(); };

/* Sesuaikan JP sekumpulan TP agar jumlahnya = target (proporsional, minimal 1 JP) */
function scaleJP(list, target){
  const sum = list.reduce((a, t) => a + (+t.jp || 0), 0);
  if (!list.length || !sum || target <= 0) return;
  list.forEach(t => { t.jp = Math.max(1, Math.round((+t.jp || 0) * target / sum)); });
  let diff = target - list.reduce((a, t) => a + t.jp, 0);
  const order = list.slice().sort((a, b) => b.jp - a.jp);
  for (let i = 0; diff !== 0 && i < 1000; i++) { const t = order[i % order.length]; if (diff > 0) { t.jp++; diff--; } else if (t.jp > 1) { t.jp--; diff++; } }
}
function fitJPKalender(p){
  const k = hitungKalender(p); let changed = false;
  [1, 2].forEach(sem => { const list = p.atp.filter(t => +t.semester === sem), avail = k["s" + sem].total;
    if (avail > 0 && list.length && atpJP(p, sem) > avail) { scaleJP(list, avail); changed = true; } });
  return changed;
}

ACT.genATP = () => {
  const p = P(); syncTxtFields(p);

  const target = +p.atpOpsi.jp || Math.round(sisaJP / sisaEl) || 20;
  const semRule = p.atpOpsi.semester === "auto" ? "Bagi TP ke semester 1 dan 2 secara wajar sesuai urutan dan JP yang tersedia." : "Semua TP untuk semester " + p.atpOpsi.semester + ".";
  const prompt = [
    "TUGAS: Turunkan Capaian Pembelajaran elemen berikut menjadi Tujuan Pembelajaran (TP) yang berurutan sebagai Alur Tujuan Pembelajaran.",

    'FORMAT JSON: {"tp":[{"tp":"Murid mampu ...","materi":"...","jp":6,"semester":1,"dpl":["Penalaran Kritis"],"cinta":[]}]}'
  ].join("\n");
  const go = () => runAI({label:"Menyusun ATP elemen " + el.nama + "...", prompt, onResult: (o) => {

  return `<table class="t"><tr><th rowspan="2" class="num">No</th><th rowspan="2">Tujuan Pembelajaran</th><th rowspan="2" class="num">JP</th>${th1}</tr><tr>${th2}</tr>${rows || `<tr><td colspan="${W.length + 3}" class="muted">Belum ada TP di semester ini.</td></tr>`}${tot}</table>`;

  if (tps.length > 4) { toast("Pilih paling banyak 4 TP per klik."); return; }
  const prompt = [
    "TUGAS: Susun Kriteria Ketercapaian Tujuan Pembelajaran (KKTP) untuk setiap TP berikut, memakai pendekatan rubrik empat tingkat.",
    tps.map((t, i) => "[" + (i + 1) + "] " + t.tp + " (materi: " + t.materi + ")").join("\n"),
    "Ketentuan: 3–5 kriteria per TP yang dapat diamati; rubrik 3–4 aspek; deskripsi tiap tingkat konkret dan berbeda jelas; tindak lanjut singkat untuk murid yang belum dan sudah mencapai. Untuk kelas rangkap, kriteria tetap per TP.",
    'FORMAT JSON: {"kktp":[{"no":1,"kriteria":["..."],"rubrik":[{"aspek":"...","l1":"Perlu bimbingan: ...","l2":"Cukup: ...","l3":"Baik: ...","l4":"Sangat baik: ..."}],"tindakLanjut":"..."}]}',
    "Isi l1–l4 tanpa awalan nama tingkat."
  ].join("\n");
  runAI({label:"Menyusun KKTP...", prompt, onResult: (o) => {
    const arr = o.kktp || (Array.isArray(o) ? o : null); if (!Array.isArray(arr) || !arr.length) throw new Error("KKTP kosong");
    arr.forEach((x, i) => { const t = tps[(+x.no || i + 1) - 1] || tps[i]; if (!t) return;
      p.kktp[t.id] = {kriteria:(x.kriteria || []).map(asText), rubrik:(x.rubrik || []).map(r => ({aspek:asText(r.aspek), l1:asText(r.l1), l2:asText(r.l2), l3:asText(r.l3), l4:asText(r.l4)})), tindakLanjut:asText(x.tindakLanjut || x.tindak_lanjut)}; });
    p.kktpPilih = [];
  }});
};

function tpSelect(bind, p){
  const cur = getPath(bind);
  return `<div><label class="f">Tujuan Pembelajaran</label><select class="in" data-bind="${bind}" data-rerender>${p.atp.map((t, i) => `<option value="${t.id}" ${cur === t.id ? "selected" : ""}>TP ${i + 1}: ${esc(t.tp.slice(0, 110))}</option>`).join("")}</select></div>`;
}
function curTP(p, bind){ let id = getPath(bind); let t = p.atp.find(x => x.id === id); if (!t && p.atp[0]) { t = p.atp[0]; setPath(bind, t.id); } return t; }
function linesArea(bind, label, arr, h){ return `<div><label class="f">${label} <small>(satu baris satu butir)</small></label><textarea class="in" data-bind="${bind}" style="min-height:${h || 80}px">${esc((arr || []).map(asText).join("\n"))}</textarea></div>`; }
function toLines(v){ return Array.isArray(v) ? v.map(asText) : String(v || "").split(/\n/).map(x => x.trim()).filter(Boolean); }

function lbl(k){ return FIELD_LABEL[k] || k.replace(/_/g, " ").replace(/^./, c => c.toUpperCase()); }
function editObj(base, obj){
  return Object.keys(obj).map(k => {
    const v = obj[k], path = base + "." + k;

    }
    return `<label class="f" style="margin-top:8px">${esc(lbl(k))}</label><textarea class="in" data-bind="${path}" style="min-height:${String(asText(v)).length > 260 ? 140 : 80}px">${esc(asText(v))}</textarea>`;
  }).join("");
}
function modulOf(p, t){ if (!p.modul[t.id]) p.modul[t.id] = {tema:t.materi || "", pertemuan:+p.modulOpsi.pertemuan || 2, dalil:"", parts:{}}; return p.modul[t.id]; }

      <div><label class="f">Alokasi waktu</label><div class="in" style="background:var(--paper)">${t.jp} JP × ${p.menitJP} menit · ±${jpPer} JP per pertemuan</div></div></div>

function modulBase(p, t, m, skipPart){
  const el = elemenList(p).find(e => e.id === t.elemenId) || {nama:t.elemen, teks:p.cpTeks};
  const prev = Object.keys(m.parts).filter(k => k !== skipPart).map(k => k.toUpperCase() + ": " + JSON.stringify(m.parts[k]).slice(0, 1800)).join("\n");
  return [
    "MODUL AJAR PEMBELAJARAN MENDALAM untuk satu TP.",
    "Elemen CP: " + el.nama + "\nTeks CP: " + (el.teks || "").slice(0, 1500),
    "TP: " + t.tp, "Materi pokok: " + t.materi, "Topik: " + (m.tema || t.materi),
    "DPL terkait: " + (t.dpl || []).join(", ") + (p.kbc ? "\nPanca Cinta terkait: " + (t.cinta || []).join(", ") : ""),
    "Alokasi: " + t.jp + " JP (" + p.menitJP + " menit/JP) dalam " + m.pertemuan + " pertemuan.",
    "Instruksi khusus guru: " + (p.modulOpsi.instruksi || "(tidak ada)"),
    prev && skipPart !== "__all" ? "BAGIAN YANG SUDAH ADA (jaga konsistensi):\n" + prev : ""
  ].join("\n");
}
function modulSpec(p, m){
  const kbcLine = p.kbc ? ',"cinta":[{"nilai":"Cinta Ilmu","wujud":"..."}]' : "";
  return {
    identifikasi: {t: "bagian IDENTIFIKASI.\n- murid: kesiapan, pengetahuan awal, minat, latar belakang, dan kebutuhan belajar murid (pakai catatan guru dan konteks daerah).\n- materi: jenis pengetahuan, relevansi dengan kehidupan murid di daerahnya, tingkat kesulitan, struktur materi, integrasi nilai dan karakter.\n- dpl: dimensi yang dikembangkan dan wujudnya.\n- rangkap: strategi bila kelas rangkap (tulis \"Tidak ada kelas rangkap\" bila tidak).",
      f: '{"murid":"...","materi":"...","dpl":[{"dimensi":"...","wujud":"..."}]' + kbcLine + ',"rangkap":"..."}'},
    desain: {t: "bagian DESAIN PEMBELAJARAN.\n- lintas_disiplin, topik, praktik_pedagogis (model/strategi/metode yang mendukung pembelajaran mendalam), kemitraan (orang tua, tokoh adat/agama, nelayan/petani, puskesmas, dsb. yang ada di sekitar), lingkungan (ruang fisik, budaya belajar; manfaatkan alam sekitar), digital (bila sarana terbatas, tulis alternatif tanpa perangkat digital).",
      f: '{"lintas_disiplin":"...","topik":"...","praktik_pedagogis":"...","kemitraan":"...","lingkungan":"...","digital":"..."}'},
    pengalaman: {t: "bagian PENGALAMAN BELAJAR untuk " + m.pertemuan + " pertemuan. Setiap pertemuan memuat kegiatan_awal (orientasi, apersepsi, motivasi; boleh memakai bahasa ibu murid), memahami, mengaplikasi, merefleksi, penutup, serta diferensiasi (termasuk pembedaan tingkat kelas bila kelas rangkap). Tulis langkah bernomor yang konkret dengan perkiraan menit, dan tandai prinsip [berkesadaran]/[bermakna]/[menggembirakan] di kegiatan yang relevan.",
      f: '{"pertemuan":[{"ke":1,"kegiatan_awal":"1. ... (10 menit)","memahami":"...","mengaplikasi":"...","merefleksi":"...","penutup":"...","diferensiasi":"..."}]}'},
    asesmen: {t: "bagian ASESMEN. Untuk awal, proses (formatif), dan akhir (sumatif): sebutkan tujuan, teknik, instrumen, dan contoh butir/tugas singkat. Instrumen harus bisa dipakai tanpa cetak (misalnya ditulis di papan, lisan, unjuk kerja).",
      f: '{"awal":"...","proses":"...","akhir":"..."}'},
    lampiran: {t: "bagian LAMPIRAN: rubrik penilaian 3–4 aspek, bahan bacaan ringkas untuk guru dan murid (sederhana, sesuai usia), glosarium 4–8 istilah, serta alat dan bahan dari lingkungan sekitar. Jangan mencantumkan judul buku atau tautan yang tidak pasti.",
      f: '{"rubrik":[{"aspek":"...","l1":"...","l2":"...","l3":"...","l4":"..."}],"bahan_bacaan":"...","glosarium":[{"istilah":"...","arti":"..."}],"media":"..."}'}
  };
}
function checkPart(part, o){
  if (!o || typeof o !== "object" || Array.isArray(o)) throw new Error("bagian " + part + " kosong");
  if (part === "pengalaman" && !Array.isArray(o.pertemuan)) throw new Error("daftar pertemuan kosong");
}
function genModulPart(part, onDone, step){
  const p = P(); const t = curTP(p, "pkg.modulOpsi.tpId"); const m = modulOf(p, t);
  const sp = modulSpec(p, m)[part];
  const label = (step ? "(" + step + "/5) " : "") + "Menyusun " + MODUL_PARTS.find(x => x.k === part).t + "...";
  runAI({label, prompt: modulBase(p, t, m, part) + "\n\nTUGAS: tulis " + sp.t + "\nFORMAT JSON: " + sp.f, onDone, onResult: (o) => { checkPart(part, o); m.parts[part] = o; }});
}
ACT.genModul = (part) => genModulPart(part);
ACT.genModulAll = () => {
  const p = P(); const t = curTP(p, "pkg.modulOpsi.tpId"); const m = modulOf(p, t);
  const keys = MODUL_PARTS.map(x => x.k);
  const go = () => {
    if (state.ai.alwaysManual || !aiLangsung()) {
      // cara salin-tempel: satu perintah untuk kelima bagian
      const sp = modulSpec(p, m);
      const prompt = modulBase(p, t, m, "__all") + "\n\nTUGAS: tulis modul lengkap dalam lima bagian berikut.\n" +
        keys.map((k, i) => (i + 1) + ". " + sp[k].t).join("\n") +
        "\nFORMAT JSON: {" + keys.map(k => '"' + k + '":' + sp[k].f).join(",") + "}";
      runAI({label:"Buat modul ajar lengkap", prompt, onResult: (o) => {
        keys.forEach(k => checkPart(k, o[k])); keys.forEach(k => { m.parts[k] = o[k]; });
      }, onDone: () => toast("Modul lengkap sudah masuk. Periksa lalu unduh Word.", 3500)});
      return;
    }
    // AI langsung: kelima bagian dibuat berurutan agar tidak terpotong
    const run = (i) => {
      if (i >= keys.length) { toast("Modul lengkap selesai. Periksa lalu unduh Word.", 3500); return; }
      genModulPart(keys[i], () => run(i + 1), i + 1);
    };
    m.parts = {};
    run(0);
  };
  if (Object.keys(m.parts).length) confirmModal("Buat ulang seluruh modul?", "Bagian modul yang sudah ada untuk TP ini akan diganti.", "Ya, buat ulang", go); else go();
};

function syncLKPD(p){
  Object.values(p.lkpd || {}).forEach(L => {

function hitungAnalisis(kunciRaw, dataRaw){
  const kunci = String(kunciRaw || "").toUpperCase().replace(/[^A-Z]/g, "");
  const rows = String(dataRaw || "").split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = /^(.*?)[;,\t|]\s*(.+)$/.exec(l) || /^(\S+)\s+(.+)$/.exec(l);
    return m ? {nama:m[1].trim(), jwb:m[2].toUpperCase().replace(/[\s,;]/g, "")} : null;
  }).filter(Boolean);
  if (!rows.length) throw new Error("Belum ada jawaban murid yang terbaca.");
  const mode = kunci ? "pg" : "skor";
  const n = kunci ? kunci.length : Math.max(...rows.map(r => r.jwb.length));
  if (!n) throw new Error("Jumlah butir 0.");
  const murid = rows.map(r => {
    const s = []; for (let i = 0; i < n; i++) { const c = r.jwb.charAt(i); s.push(mode === "pg" ? (c && c === kunci[i] ? 1 : 0) : (c === "1" ? 1 : 0)); }
    return {nama:r.nama, jwb:r.jwb, s, total:s.reduce((a, b) => a + b, 0)};
  });
  const N = murid.length, sorted = murid.slice().sort((a, b) => b.total - a.total);
  const g = Math.max(1, Math.round(N * 0.27)); const up = sorted.slice(0, g), lo = sorted.slice(-g);
  const items = []; let sumpq = 0;
  for (let i = 0; i < n; i++) {
    const benar = murid.reduce((a, m) => a + m.s[i], 0); const pp = benar / N; sumpq += pp * (1 - pp);
    const D = (up.reduce((a, m) => a + m.s[i], 0) - lo.reduce((a, m) => a + m.s[i], 0)) / g;
    const kes = pp < 0.3 ? "Sukar" : pp <= 0.7 ? "Sedang" : "Mudah";
    const db = D < 0 ? "Negatif" : D < 0.2 ? "Jelek" : D < 0.4 ? "Cukup" : D < 0.7 ? "Baik" : "Baik sekali";
    let peng = "";
    if (mode === "pg") {
      const opts = {}; murid.forEach(m => { const c = m.jwb.charAt(i) || "-"; opts[c] = (opts[c] || 0) + 1; });
      const letters = [...new Set(["A","B","C","D"].concat(Object.keys(opts).filter(x => /[A-E]/.test(x))))].sort();
      peng = letters.map(L => { const pct = Math.round((opts[L] || 0) / N * 100); return L + ":" + pct + "%" + (L === kunci[i] ? "*" : (pct < 5 ? "!" : "")); }).join(" ");
    }
    const kep = (D < 0.2 || pp < 0.1 || pp > 0.95) ? (D < 0 ? "Buang/ganti" : "Revisi") : "Pakai";
    items.push({no:i + 1, benar, p:pp, kes, D, db, peng, kep});
  }
  const tot = murid.map(m => m.total), mean = tot.reduce((a, b) => a + b, 0) / N;
  const varr = tot.reduce((a, b) => a + (b - mean) * (b - mean), 0) / (N > 1 ? N - 1 : 1);
  const kr20 = n > 1 && varr > 0 ? (n / (n - 1)) * (1 - sumpq / varr) : null;
  return {mode, n, N, g, items, murid:murid.map(m => ({nama:m.nama, total:m.total, nilai:Math.round(m.total / n * 100)})), mean, kr20};
}
function analisisHTML(h){
  const it = h.items.map(x => `<tr><td class="num">${x.no}</td><td class="num">${x.benar}</td><td class="num">${x.p.toFixed(2)}</td><td>${x.kes}</td><td class="num">${x.D.toFixed(2)}</td><td>${x.db}</td>${h.mode === "pg" ? `<td class="small">${esc(x.peng)}</td>` : ""}<td><b>${x.kep}</b></td></tr>`).join("");
  const mu = h.murid.map((m, i) => `<tr><td class="num">${i + 1}</td><td>${esc(m.nama)}</td><td class="num">${m.total}</td><td class="num">${m.nilai}</td></tr>`).join("");
  const rel = h.kr20 == null ? "-" : h.kr20.toFixed(2) + (h.kr20 >= 0.7 ? " (reliabel)" : " (kurang reliabel)");
  return `<div class="note info" style="margin-top:12px"><b>${h.N} murid · ${h.n} butir.</b> Rata-rata skor ${h.mean.toFixed(1)} · Reliabilitas KR-20: ${rel}. Kelompok atas/bawah masing-masing ${h.g} murid (27%).</div>
    <h3>Analisis per butir</h3><div class="tbl-wrap"><table class="t"><tr><th class="num">No</th><th class="num">Benar</th><th class="num">p</th><th>Kesukaran</th><th class="num">D</th><th>Daya beda</th>${h.mode === "pg" ? "<th>Sebaran jawaban</th>" : ""}<th>Keputusan</th></tr>${it}</table></div>
    <p class="small muted">p = proporsi murid yang menjawab benar (sukar &lt; 0,30; sedang 0,30–0,70; mudah &gt; 0,70). D = selisih proporsi benar kelompok atas dan bawah. * = kunci; ! = pengecoh dipilih kurang dari 5% murid (kurang berfungsi). Pada kelas kecil (di bawah 20 murid), angka ini hanya petunjuk awal.</p>
    <h3>Nilai murid</h3><div class="tbl-wrap"><table class="t"><tr><th class="num">No</th><th>Nama</th><th class="num">Skor</th><th class="num">Nilai</th></tr>${mu}</table></div>`;
}

DOC.promes = (p) => ({title:"Program Semester", landscape:true, body: judul("PROGRAM SEMESTER (PROMES)", p) + identitas(p) + landasan(p) + `<h2>Semester 1</h2>${promesTable(p, 1, true)}<h2>Semester 2</h2>${promesTable(p, 2, true)}<p class="small">Angka di sel = JP yang dialokasikan pada minggu tersebut. Sel kosong berarsir = minggu tanpa pelajaran mapel ini.</p>` + ttd(p)});
DOC.kktp = (p) => ({title:"KKTP", body: judul("KRITERIA KETERCAPAIAN TUJUAN PEMBELAJARAN (KKTP)", p) + identitas(p) + landasan(p) +
  p.atp.filter(t => p.kktp[t.id]).map(t => { const k = p.kktp[t.id]; return `<h2>TP ${p.atp.indexOf(t) + 1}: ${esc(t.tp)}</h2><h3>Kriteria ketercapaian</h3>${ul(k.kriteria, true)}<h3>Rubrik</h3>${rubrikTbl(k.rubrik)}${k.tindakLanjut ? `<h3>Tindak lanjut</h3><p>${nl2br(k.tindakLanjut)}</p>` : ""}`; }).join("") +

DOC.modul = (p) => {

  const el = elemenList(p).find(e => e.id === t.elemenId) || {teks:p.cpTeks};
  let b = judul("MODUL AJAR PEMBELAJARAN MENDALAM", p) + identitas(p, [["Topik", m.tema || t.materi], ["Alokasi waktu", t.jp + " JP × " + p.menitJP + " menit (" + m.pertemuan + " pertemuan)"]]) + landasan(p);
  b += `<h2>A. Identifikasi</h2>${pa.identifikasi ? objHTML(pa.identifikasi) : "<p>-</p>"}`;
  if (m.dalil) b += `<h3>Dalil/ayat/kutipan (ditulis guru)</h3><p>${nl2br(m.dalil)}</p>`;
  b += `<h2>B. Desain Pembelajaran</h2><h3>Capaian Pembelajaran</h3><p>${nl2br(el.teks || "")}</p><h3>Tujuan Pembelajaran</h3><p>${esc(t.tp)}</p>${pa.desain ? objHTML(pa.desain) : ""}`;
  b += `<h2>C. Pengalaman Belajar</h2>` + ((pa.pengalaman && pa.pengalaman.pertemuan) ? pa.pengalaman.pertemuan.map(x => `<h3>Pertemuan ${esc(x.ke)}</h3><table>${["kegiatan_awal","memahami","mengaplikasi","merefleksi","penutup","diferensiasi"].filter(f => x[f]).map(f => `<tr><td style="width:22%"><b>${esc(lbl(f))}</b></td><td>${nl2br(asText(x[f]))}</td></tr>`).join("")}</table>`).join("") : "<p>-</p>");
  b += `<h2>D. Asesmen</h2>${pa.asesmen ? objHTML(pa.asesmen) : "<p>-</p>"}`;
  if (p.kktp[t.id]) b += `<h3>Kriteria ketercapaian (KKTP)</h3>${ul(p.kktp[t.id].kriteria, true)}`;
  b += `<h2>E. Lampiran</h2>${pa.lampiran ? objHTML(pa.lampiran) : "<p>-</p>"}`;
  return {title:"Modul Ajar TP " + (p.atp.indexOf(t) + 1), body: b + ttd(p)};
};
DOC.lkpd = (p) => {
  const t = curTP(p, "pkg.lkpdTp"); if (!t) return null; const L = p.lkpd[t.id]; if (!L) return null;
  return {title:"LKPD TP " + (p.atp.indexOf(t) + 1), body: `<h1>LEMBAR KERJA MURID</h1><p class="sub">${esc(L.judul)}</p>
    <table class="id"><tr><td style="width:25%">Nama</td><td>: ..............................................</td></tr><tr><td>Kelas</td><td>: ..............................................</td></tr><tr><td>Mata pelajaran</td><td>: ${esc(mapelName(p))}</td></tr></table>
    <h2>Tujuan</h2><p>${nl2br(L.tujuan)}</p><h2>Petunjuk</h2>${ul(L.petunjuk, true)}${toLines(L.alat_bahan).length ? `<h2>Alat dan bahan</h2>${ul(L.alat_bahan)}` : ""}
    ${(L.kegiatan || []).map((k, i) => `<h2>Kegiatan ${i + 1}: ${esc(k.judul)}${k.untuk && !/semua/i.test(k.untuk) ? " (" + esc(k.untuk) + ")" : ""}</h2><h3>Langkah</h3>${ul(k.langkah, true)}<h3>Jawablah</h3>${toLines(k.pertanyaan).map((q, j) => `<p>${j + 1}. ${esc(q)}</p><p>.................................................................................................................</p>`).join("")}`).join("")}
    <h2>Refleksi</h2>${toLines(L.refleksi).map(q => `<p>${esc(q)}</p><p>.................................................................................................................</p>`).join("")}`};
};
DOC.asesmen = (p) => ({title:"Rencana Asesmen", landscape:true, body: judul("RENCANA ASESMEN", p) + identitas(p) + landasan(p) + `<table><tr>${AS_COLS.map(c => `<th>${c[1]}</th>`).join("")}</tr>${p.asesmen.rows.map(r => `<tr>${AS_COLS.map(([c]) => `<td>${nl2br(r[c])}</td>`).join("")}</tr>`).join("")}</table>` + ttd(p)});
DOC.kisi = (p) => { const B = p.kisi.butir; return {title:"Kisi-kisi dan Kartu Soal", body: judul("KISI-KISI DAN KARTU SOAL", p) + identitas(p) + landasan(p) +
  `<h2>Kisi-kisi</h2><table><tr><th>No</th><th>TP</th><th>Indikator soal</th><th>Level</th><th>Bentuk</th><th>Kunci</th></tr>${B.map((b, i) => `<tr><td class="c">${i + 1}</td><td>${esc(b.tp)}</td><td>${esc(b.indikator)}</td><td class="c">${esc(b.level)}</td><td>${esc(b.bentuk)}</td><td class="c">${esc(b.kunci)}</td></tr>`).join("")}</table>
  <h2>Kartu soal</h2>${B.map((b, i) => `<table style="margin-bottom:8pt"><tr><th style="width:22%">No. soal</th><td>${i + 1}</td></tr><tr><th>TP</th><td>${esc(b.tp)}</td></tr><tr><th>Indikator</th><td>${esc(b.indikator)}</td></tr><tr><th>Level / bentuk</th><td>${esc(b.level)} / ${esc(b.bentuk)}</td></tr><tr><th>Soal</th><td>${nl2br(b.soal)}${b.opsi ? "<br>" + Object.entries(b.opsi).map(([o, v]) => esc(o) + ". " + esc(v)).join("<br>") : ""}</td></tr><tr><th>Kunci</th><td>${esc(b.kunci)}</td></tr><tr><th>Pembahasan / pedoman skor</th><td>${nl2br(b.pembahasan)}</td></tr></table>`).join("")}` + ttd(p)}; };
DOC.naskah = (p) => ({title:"Naskah Soal", body: `<h1>${esc((state.profil.sekolah || "").toUpperCase())}</h1><p class="sub">Asesmen ${esc(mapelName(p))} · Kelas ${esc(p.kelas)} · Tahun ajaran ${esc(state.profil.tahunAjaran)}</p>
  <table class="id"><tr><td style="width:20%">Nama</td><td>: ........................................</td><td style="width:20%">Kelas</td><td>: ............</td></tr></table><p><b>Petunjuk:</b> Bacalah setiap soal dengan teliti. Kerjakan yang mudah lebih dahulu.</p>
  ${p.kisi.butir.map((b, i) => `<p>${i + 1}. ${nl2br(b.soal)}</p>${b.opsi ? `<p style="margin-left:18pt">${Object.entries(b.opsi).map(([o, v]) => esc(o) + ". " + esc(v)).join("<br>")}</p>` : "<p>.................................................................................................................</p>"}`).join("")}`});

const pageDiv = (html) => html.indexOf("<h1") >= 0 ? html.replace("<h1", '<h1 style="page-break-before:always"') : '<p style="page-break-before:always;margin:0"></p>' + html;
DOC.paket = (p) => {
  const keepM = p.modulOpsi.tpId, keepL = p.lkpdTp;
  const parts = [];
  const add = (judul, d) => { if (d && d.body) parts.push({judul, body:d.body}); };
  if (jpPerMinggu(p)) add("Rincian minggu dan JP efektif", DOC.kalender(p));
  if (p.cpTeks.trim()) add("Capaian Pembelajaran", DOC.cp(p));
  if (p.atp.length) { add("Alur Tujuan Pembelajaran", DOC.atp(p)); add("Program Tahunan", DOC.prota(p)); add("Program Semester", DOC.promes(p)); }
  if (Object.keys(p.kktp).length) add("KKTP", DOC.kktp(p));
  p.atp.forEach((t, i) => { const m = p.modul[t.id]; if (m && m.parts && Object.keys(m.parts).length) { p.modulOpsi.tpId = t.id; add("Modul Ajar TP " + (i + 1), DOC.modul(p)); } });
  p.atp.forEach((t, i) => { if (p.lkpd[t.id]) { p.lkpdTp = t.id; add("LKPD TP " + (i + 1), DOC.lkpd(p)); } });
  p.modulOpsi.tpId = keepM; p.lkpdTp = keepL;
  if (p.asesmen.rows.length) add("Rencana Asesmen", DOC.asesmen(p));
  if (p.kisi.butir.length) { add("Kisi-kisi dan Kartu Soal", DOC.kisi(p)); add("Naskah Soal", DOC.naskah(p)); }
  if (p.analisis.hasil) add("Analisis Butir Soal", DOC.analisis(p));
  if (!parts.length) return null;
  const pr = state.profil;
  const cover = `<br><br><br><h1 style="font-size:20pt">PERANGKAT AJAR</h1><p class="sub" style="font-size:14pt">${esc(mapelName(p))}<br>Kelas ${esc(p.kelas)} · Fase ${faseOf(p)}${p.kelasRangkap ? "<br>(" + esc(p.kelasRangkap) + ")" : ""}</p>
    <p class="sub" style="font-size:13pt">Tahun Ajaran ${esc(pr.tahunAjaran)}</p><br><br><p class="sub">Disusun oleh:<br><b>${esc(pr.namaGuru || "..............................")}</b><br>NIP. ${esc(pr.nip || "-")}</p><br><br>
    <p class="sub" style="font-size:13pt"><b>${esc((pr.sekolah || "").toUpperCase())}</b><br>${esc([pr.desa, pr.kabupaten, pr.provinsi].filter(Boolean).join(", "))}</p>
    ${pageDiv(`<h1>DAFTAR ISI</h1><ol>${parts.map(x => `<li>${esc(x.judul)}</li>`).join("")}</ol>`)}`;
  return {title:"Perangkat Ajar Lengkap", multi:true, body: cover + parts.map(x => pageDiv(x.body)).join("")};
};

function buildDoc(kind){
  const p = P(); syncTxtFields(p); syncKKTP(p); syncLKPD(p);
  const d = DOC[kind] && DOC[kind](p);
  if (!d) { toast("Belum ada isi untuk diunduh di langkah ini."); return null; }
  d.body = d.body.replace(/<table(?![^>]*class="(?:id|ttd)")([^>]*)>/g, '<table border="1" cellspacing="0" cellpadding="4"$1>');
  return d;
}
ACT.wordDl = (kind) => {
  const d = buildDoc(kind); if (!d) return;
  const html = docShell(d.title, d.body, d.landscape, d.multi);
  const nama = (d.title + " " + mapelName(P()) + " kelas " + P().kelas).replace(/[^\w\-]+/g, "_").slice(0, 80);
  downloadBlob(new Blob(["﻿", html], {type:"application/msword"}), nama + ".doc");
  toast("Dokumen Word diunduh. Bila Word bertanya, pilih Aktifkan Pengeditan.", 3500);
};
ACT.wordCopy = (kind) => {
  const d = buildDoc(kind); if (!d) return;
  const html = docShell(d.title, d.body, d.landscape, d.multi);
  const plain = d.body.replace(/<br\s*\/?>/g, "\n").replace(/<\/(p|tr|h\d|li)>/g, "\n").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({"text/html": new Blob([html], {type:"text/html"}), "text/plain": new Blob([plain], {type:"text/plain"})})]).then(() => toast("Tersalin. Tempel di Word atau Google Dokumen."), () => copyRich(d.body));
  } else copyRich(d.body);
};
function copyRich(body){
  const div = document.createElement("div"); div.innerHTML = body; div.style.position = "fixed"; div.style.left = "-9999px"; document.body.appendChild(div);
  const r = document.createRange(); r.selectNodeContents(div); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  try { document.execCommand("copy"); toast("Tersalin. Tempel di Word atau Google Dokumen."); } catch (e) { toast("Gagal menyalin. Pakai Unduh Word."); }
  s.removeAllRanges(); div.remove();
}
